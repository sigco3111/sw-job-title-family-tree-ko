name: redesign
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "apply: 파일 반영 / shots: 스크린샷"
        type: choice
        options: [apply, shots]
        default: apply

permissions:
  contents: write

jobs:
  apply:
    if: github.event.inputs.mode == 'apply'
    runs-on: ubuntu-latest
    env:
      CSS_TEXT: |
        /* 소프트웨어 직무 계보 — 한국어판
           에디토리얼/인쇄물 톤. 종이색 바탕 + 잉크 본문 + 벽돌색 포인트 1색,
           계열은 채도 낮춘 어스톤으로 작은 마커에만. 구조는 1px 헤어라인과 여백으로.
           외부 폰트·CDN 없음. */
        
        :root {
          --paper: #f7f3ea;
          --paper-2: #efe9db;
          --paper-3: #e6ddcb;
          --card: #fbf8f1;
          --ink: #1f1b16;
          --ink-2: #4a4136;
          --ink-3: #776b5b;
          --rule: #d7cdba;
          --rule-strong: #b6a88f;
          --accent: #8d3820;
        
          --serif: "Noto Serif KR", "Nanum Myeongjo", Batang, "Iowan Old Style", Georgia,
            "Times New Roman", serif;
          --sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system,
            "Segoe UI", sans-serif;
        
          --node-w: 168px;
          --node-h: 52px;
          --rail-w: 86px;
          --lane-w: 196px;
          color-scheme: light;
        }
        
        * { box-sizing: border-box; }
        
        [hidden] { display: none !important; }
        
        html { scroll-behavior: smooth; }
        
        body {
          margin: 0;
          background: var(--paper);
          color: var(--ink);
          font-family: var(--sans);
          font-size: 15px;
          line-height: 1.68;
          -webkit-font-smoothing: antialiased;
          text-rendering: optimizeLegibility;
          overflow-x: hidden;
        }
        
        a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: var(--rule-strong); }
        a:hover { text-decoration-color: var(--accent); color: var(--accent); }
        
        code {
          font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
          font-size: 0.86em;
          padding: 1px 4px;
          border: 1px solid var(--rule);
          background: var(--paper-2);
        }
        
        :where(button, a, input, [tabindex]):focus-visible {
          outline: 2px solid var(--accent);
          outline-offset: 2px;
          border-radius: 0;
        }
        
        .skip {
          position: absolute;
          left: -9999px;
          top: 0;
          padding: 10px 14px;
          background: var(--paper);
          color: var(--ink);
          border: 1px solid var(--ink);
          z-index: 100;
        }
        .skip:focus { left: 12px; top: 12px; }
        
        /* ───────────── 히어로 ───────────── */
        .hero {
          border-bottom: 1px solid var(--rule-strong);
          padding: clamp(56px, 9vw, 112px) clamp(20px, 5vw, 40px) clamp(40px, 6vw, 64px);
        }
        .hero-bg { display: none; }
        .hero-inner { max-width: 1080px; margin: 0 auto; }
        
        .eyebrow {
          margin: 0 0 clamp(18px, 2.4vw, 30px);
          font-size: 11.5px;
          font-weight: 600;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: var(--ink-3);
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .eyebrow::before {
          content: "";
          width: 28px;
          height: 1px;
          background: var(--rule-strong);
          flex: none;
        }
        .eyebrow .dot { display: none; }
        
        .hero h1 {
          margin: 0 0 clamp(20px, 2.6vw, 30px);
          font-family: var(--serif);
          font-weight: 700;
          font-size: clamp(40px, 7.6vw, 88px);
          line-height: 1.02;
          letter-spacing: -0.03em;
          max-width: 15ch;
        }
        .hero h1 .grad {
          color: var(--accent);
          background: none;
          -webkit-text-fill-color: currentColor;
        }
        
        .lede {
          max-width: 46em;
          margin: 0 0 clamp(24px, 3vw, 34px);
          font-size: clamp(15px, 1.5vw, 17.5px);
          line-height: 1.8;
          color: var(--ink-2);
        }
        .lede strong { color: var(--ink); font-weight: 600; }
        
        /* 카운터는 쓰지 않는다. 보이는 숫자는 정적 텍스트 */
        .hero-stats { display: none; }
        
        .hero-facts {
          display: flex;
          flex-wrap: wrap;
          align-items: baseline;
          gap: 0 clamp(16px, 3vw, 34px);
          margin: 0 0 clamp(26px, 3.4vw, 38px);
          padding-top: 14px;
          border-top: 1px solid var(--rule);
          max-width: 46em;
          font-size: 12.5px;
          letter-spacing: 0.02em;
          color: var(--ink-3);
        }
        .hero-facts span { display: inline-flex; align-items: baseline; gap: 0; }
        .hero-facts b {
          font-family: var(--serif);
          font-size: 21px;
          font-weight: 600;
          color: var(--ink);
          font-variant-numeric: tabular-nums;
          letter-spacing: -0.01em;
        }
        
        .hero-actions {
          display: flex;
          flex-wrap: wrap;
          gap: 10px 28px;
          margin: 0 0 clamp(28px, 3.4vw, 40px);
        }
        .btn {
          display: inline-flex;
          align-items: baseline;
          gap: 8px;
          padding: 0 0 3px;
          border: 0;
          border-bottom: 1px solid var(--rule-strong);
          border-radius: 0;
          background: none;
          color: var(--ink);
          font-size: 14px;
          font-weight: 600;
          text-decoration: none;
        }
        .btn:hover {
          color: var(--accent);
          border-bottom-color: var(--accent);
          text-decoration: none;
        }
        .btn::after {
          content: "→";
          font-family: var(--sans);
          font-weight: 400;
          transition: transform 0.18s ease;
        }
        .btn:hover::after { transform: translateX(3px); }
        .btn.ghost { color: var(--ink-2); font-weight: 500; }
        .btn.ghost::after { content: "↓"; }
        
        .notice {
          display: flex;
          gap: 12px;
          align-items: flex-start;
          max-width: 46em;
          margin: 0;
          padding: 12px 0 12px 14px;
          border: 0;
          border-left: 2px solid var(--rule-strong);
          background: none;
          font-size: 12.5px;
          line-height: 1.7;
          color: var(--ink-3);
        }
        .notice .badge {
          flex: none;
          font-size: 10.5px;
          font-weight: 700;
          letter-spacing: 0.12em;
          color: var(--ink-2);
          border: 0;
          padding: 2px 0 0;
          margin: 0;
        }
        .notice b { color: var(--ink-2); font-weight: 600; }
        
        /* ───────────── 컨트롤 ───────────── */
        .controls {
          position: sticky;
          top: 0;
          z-index: 40;
          padding: 10px clamp(12px, 3vw, 28px) 0;
          background: var(--paper);
          border-bottom: 1px solid var(--rule-strong);
        }
        .controls-row {
          display: flex;
          gap: 12px;
          align-items: center;
          max-width: 1440px;
          margin: 0 auto;
        }
        .controls-row + .controls-row { margin-top: 6px; }
        .controls-row.wrap { flex-wrap: wrap; padding-bottom: 8px; }
        
        .search {
          position: relative;
          flex: 1 1 260px;
          display: flex;
          align-items: center;
          height: 38px;
          padding: 0 8px 0 10px;
          background: var(--card);
          border: 1px solid var(--rule-strong);
          border-radius: 0;
        }
        .search:focus-within { border-color: var(--ink-2); box-shadow: inset 0 -1px 0 var(--accent); }
        .search svg {
          width: 15px; height: 15px;
          fill: none; stroke: var(--ink-3); stroke-width: 1.6; stroke-linecap: round;
          flex: none;
        }
        .search input {
          flex: 1;
          min-width: 0;
          height: 100%;
          padding: 0 8px;
          border: 0;
          background: none;
          outline: 0;
          color: var(--ink);
          font-family: inherit;
          font-size: 13.5px;
        }
        .search input::placeholder { color: var(--ink-3); }
        .search input::-webkit-search-cancel-button { display: none; }
        
        .icon-btn {
          flex: none;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 30px;
          height: 26px;
          padding: 0;
          border: 1px solid var(--rule);
          border-radius: 0;
          background: none;
          color: var(--ink-2);
          font-family: inherit;
          font-size: 13px;
          line-height: 1;
          cursor: pointer;
        }
        .icon-btn:hover { border-color: var(--ink-2); color: var(--ink); }
        .icon-btn.wide { width: auto; padding: 0 9px; font-size: 11.5px; letter-spacing: 0.04em; }
        .zoom { display: flex; gap: 5px; flex: none; }
        
        .chips {
          display: flex;
          flex-wrap: wrap;
          gap: 2px 18px;
          flex: 1 1 auto;
          align-items: baseline;
        }
        .chip {
          display: inline-flex;
          align-items: center;
          gap: 7px;
          padding: 4px 0 5px;
          border: 0;
          border-bottom: 1px solid transparent;
          border-radius: 0;
          background: none;
          color: var(--ink-3);
          font-family: inherit;
          font-size: 12.5px;
          letter-spacing: 0.01em;
          white-space: nowrap;
          cursor: pointer;
          transition: color 0.14s ease, border-color 0.14s ease;
        }
        .chip i {
          width: 6px;
          height: 6px;
          border-radius: 0;
          background: color-mix(in srgb, var(--c, #8a7b64) 42%, #c6baa4);
          flex: none;
        }
        .chip:hover { color: var(--ink); border-bottom-color: var(--rule-strong); }
        .chip[aria-pressed="true"] {
          color: var(--ink);
          font-weight: 700;
          background: none;
          border-bottom: 1px solid var(--accent);
        }
        .chip[aria-pressed="true"] i { background: var(--ink); }
        
        .hint {
          margin: 0;
          flex: none;
          font-size: 11.5px;
          letter-spacing: 0.02em;
          color: var(--ink-3);
          font-variant-numeric: tabular-nums;
        }
        
        .era-bar {
          display: flex;
          gap: 0;
          overflow-x: auto;
          scrollbar-width: none;
          max-width: 1440px;
          margin: 0 auto;
          padding: 2px 0 8px;
          border-top: 1px solid var(--rule);
          -webkit-overflow-scrolling: touch;
        }
        .era-bar::-webkit-scrollbar { display: none; }
        .era-btn {
          flex: none;
          padding: 6px 12px 5px;
          border: 0;
          border-right: 1px solid var(--rule);
          border-radius: 0;
          background: none;
          color: var(--ink-3);
          font-family: inherit;
          font-size: 11.5px;
          letter-spacing: 0.02em;
          font-variant-numeric: tabular-nums;
          cursor: pointer;
        }
        .era-btn:first-child { padding-left: 0; }
        .era-btn:hover { color: var(--ink); background: var(--paper-2); }
        
        /* ───────────── 계보도 ───────────── */
        .chart-shell {
          max-width: 1440px;
          margin: 0 auto;
          padding: clamp(24px, 4vw, 40px) clamp(12px, 3vw, 28px) clamp(48px, 7vw, 80px);
        }
        .chart-head {
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          gap: 8px 24px;
          flex-wrap: wrap;
          margin-bottom: 10px;
          padding-bottom: 7px;
          border-bottom: 1px solid var(--ink);
        }
        .chart-head h2 {
          margin: 0;
          font-family: var(--serif);
          font-size: 17px;
          font-weight: 700;
          letter-spacing: 0.02em;
        }
        .legend {
          display: flex;
          gap: 18px;
          flex-wrap: wrap;
          font-size: 11.5px;
          color: var(--ink-3);
        }
        .legend span { display: inline-flex; align-items: center; gap: 7px; }
        .legend .swatch {
          width: 20px;
          height: 0;
          border-top: 1px solid var(--ink-2);
          flex: none;
        }
        .legend .swatch.dashed { border-top-style: dashed; border-top-color: var(--rule-strong); }
        .legend .swatch.both { border-top-style: dashed; border-top-color: var(--ink-2); }
        
        .scroll-hint {
          display: none;
          margin: 0 0 8px;
          font-size: 11.5px;
          color: var(--ink-3);
          letter-spacing: 0.02em;
        }
        
        .stage {
          position: relative;
          overflow: auto;
          border: 1px solid var(--rule-strong);
          border-radius: 0;
          background: var(--card);
          max-height: min(78vh, 900px);
          -webkit-overflow-scrolling: touch;
        }
        .stage::-webkit-scrollbar { width: 9px; height: 9px; }
        .stage::-webkit-scrollbar-thumb { background: var(--rule-strong); }
        .stage::-webkit-scrollbar-track { background: var(--paper-2); }
        
        .canvas { position: relative; transform-origin: 0 0; will-change: transform; }
        
        .edges {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: visible;
          pointer-events: none;
        }
        #edges line,
        #edges path,
        #edges polyline {
          stroke: #9c9284 !important;
        }
        #edges .edge {
          fill: none;
          stroke-linecap: round;
          stroke-width: 1.2;
          transition: opacity 0.18s ease;
        }
        #edges .edge.dashed {
          stroke: #c0b49e !important;
          stroke-dasharray: 3 4;
        }
        #edges marker path,
        #edges marker polygon,
        #edges marker circle {
          fill: #9c9284 !important;
          stroke: none !important;
        }
        
        .eras-gutter { position: absolute; left: 0; top: 0; width: var(--rail-w); height: 100%; }
        .era-mark {
          position: absolute;
          left: 0;
          width: var(--rail-w);
          height: 100%;
          padding: 0 12px 0 0;
          text-align: right;
          border-right: 1px solid var(--rule);
        }
        .era-mark b {
          position: sticky;
          top: 0;
          display: block;
          padding-top: 8px;
          font-family: var(--serif);
          font-size: 12px;
          font-weight: 700;
          color: var(--ink-2);
          letter-spacing: 0.01em;
          font-variant-numeric: tabular-nums;
        }
        .era-mark em {
          display: block;
          margin-top: 3px;
          font-size: 10.5px;
          font-style: normal;
          line-height: 1.45;
          color: var(--ink-3);
        }
        
        .nodes { position: absolute; inset: 0; }
        
        .node {
          position: absolute;
          width: var(--node-w);
          height: var(--node-h);
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 1px;
          padding: 6px 10px 6px 16px;
          border: 0;
          border-radius: 0;
          background: none;
          color: var(--ink);
          font-family: inherit;
          text-align: left;
          cursor: pointer;
          box-shadow: none;
          transition: background-color 0.15s ease, opacity 0.18s ease;
        }
        .node::before {
          content: "";
          position: absolute;
          left: 2px;
          top: 50%;
          margin-top: -3px;
          width: 6px;
          height: 6px;
          background: color-mix(in srgb, var(--c, #8a7b64) 42%, #c6baa4);
          transition: height 0.15s ease, margin 0.15s ease, background-color 0.15s ease;
        }
        .node .ko {
          font-size: 12.8px;
          font-weight: 500;
          line-height: 1.3;
          letter-spacing: -0.01em;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .node .en {
          padding-right: 30px;
          font-size: 9.6px;
          letter-spacing: 0.02em;
          color: var(--ink-3);
          line-height: 1.3;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .node .yr {
          position: absolute;
          right: 8px;
          bottom: 5px;
          font-size: 9.4px;
          color: var(--ink-3);
          font-variant-numeric: tabular-nums;
        }
        
        .node:hover,
        .node:focus-visible {
          background: var(--paper-2);
          outline: none;
        }
        .node:hover::before,
        .node:focus-visible::before {
          height: 16px;
          margin-top: -8px;
          background: var(--ink);
        }
        .node:focus-visible { box-shadow: inset 0 0 0 1px var(--accent); }
        
        .node.landmark .ko { font-weight: 700; }
        
        .node.is-active { background: var(--paper-3); z-index: 7; }
        .node.is-active::before {
          height: 100%;
          top: 0;
          margin-top: 0;
          width: 2px;
          background: var(--accent);
        }
        .node.is-active .ko { font-weight: 700; }
        
        .node.is-anc { z-index: 5; }
        .node.is-anc .ko { font-weight: 700; }
        .node.is-dim { opacity: 0.28; }
        .node.is-match { background: var(--paper-2); z-index: 6; }
        .node.is-match .ko { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
        .node.is-match::before { background: var(--accent); }
        
        /* ───────────── 상세 패널 ───────────── */
        .panel {
          position: fixed;
          top: 0;
          right: 0;
          z-index: 60;
          width: min(420px, 100vw);
          height: 100%;
          padding: 26px 26px 40px;
          overflow-y: auto;
          background: var(--card);
          border-left: 1px solid var(--rule-strong);
          box-shadow: none;
          transform: translateX(101%);
          transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .panel.open { transform: none; }
        .panel-grip { display: none; }
        
        .panel-close {
          position: absolute;
          top: 16px;
          right: 18px;
          width: 28px;
          height: 28px;
          padding: 0;
          border: 1px solid var(--rule);
          border-radius: 0;
          background: none;
          color: var(--ink-2);
          font-family: inherit;
          font-size: 12px;
          line-height: 1;
          cursor: pointer;
        }
        .panel-close:hover { border-color: var(--ink-2); color: var(--ink); }
        
        .panel-fam {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          margin: 0 0 14px;
          padding: 0;
          border: 0;
          background: none;
          font-size: 10.5px;
          font-weight: 700;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: var(--ink-3);
        }
        .panel-fam::before {
          content: "";
          width: 7px;
          height: 7px;
          background: color-mix(in srgb, var(--c, #8a7b64) 42%, #c6baa4);
        }
        
        .panel h3 {
          margin: 0 0 6px;
          font-family: var(--serif);
          font-size: 26px;
          font-weight: 700;
          line-height: 1.28;
          letter-spacing: -0.02em;
        }
        .panel .en-name {
          margin: 0 0 18px;
          font-size: 11.5px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: var(--ink-3);
        }
        .panel .year-line {
          display: flex;
          align-items: baseline;
          gap: 10px;
          margin: 0 0 20px;
          padding: 8px 0;
          border: 0;
          border-top: 1px solid var(--rule);
          border-bottom: 1px solid var(--rule);
          border-radius: 0;
          background: none;
          font-size: 12px;
          color: var(--ink-3);
          font-variant-numeric: tabular-nums;
        }
        .panel .year-line b {
          font-family: var(--serif);
          font-size: 17px;
          font-weight: 600;
          color: var(--ink);
        }
        .panel .desc {
          margin: 0 0 24px;
          font-size: 14px;
          line-height: 1.85;
          color: var(--ink-2);
        }
        .panel h4 {
          margin: 24px 0 8px;
          padding-top: 10px;
          border-top: 1px solid var(--rule);
          font-size: 10.5px;
          font-weight: 700;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: var(--ink-3);
        }
        .panel .rel { display: block; }
        .rel-btn {
          display: flex;
          align-items: baseline;
          gap: 8px;
          width: 100%;
          padding: 6px 0;
          border: 0;
          border-bottom: 1px solid var(--rule);
          border-radius: 0;
          background: none;
          color: var(--ink);
          font-family: inherit;
          font-size: 13px;
          text-align: left;
          cursor: pointer;
        }
        .rel-btn:hover { color: var(--accent); background: none; }
        .rel-btn .k {
          flex: none;
          margin-left: auto;
          font-size: 10px;
          letter-spacing: 0.06em;
          color: var(--ink-3);
        }
        .panel .empty { font-size: 12.5px; color: var(--ink-3); }
        .panel .link-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 26px; }
        .panel .copy {
          padding: 7px 12px;
          border: 1px solid var(--rule-strong);
          border-radius: 0;
          background: none;
          color: var(--ink-2);
          font-family: inherit;
          font-size: 11.5px;
          letter-spacing: 0.02em;
          cursor: pointer;
        }
        .panel .copy:hover { border-color: var(--ink-2); color: var(--ink); }
        
        .scrim {
          position: fixed;
          inset: 0;
          z-index: 55;
          background: rgba(31, 27, 22, 0.34);
          backdrop-filter: none;
        }
        
        /* ───────────── 이야기 ───────────── */
        .stories {
          padding: clamp(40px, 6vw, 76px) clamp(20px, 5vw, 40px);
          border-top: 1px solid var(--rule-strong);
        }
        .section-head { max-width: 1200px; margin: 0 auto clamp(20px, 3vw, 32px); }
        .section-head h2 {
          margin: 0 0 8px;
          font-family: var(--serif);
          font-size: clamp(24px, 3.4vw, 32px);
          font-weight: 700;
          letter-spacing: -0.02em;
        }
        .section-head p {
          max-width: 44em;
          margin: 0;
          font-size: 13.5px;
          line-height: 1.75;
          color: var(--ink-3);
        }
        
        .story-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
          gap: 0 clamp(24px, 4vw, 48px);
          max-width: 1200px;
          margin: 0 auto;
        }
        .story {
          padding: 18px 0 22px;
          border: 0;
          border-top: 1px solid var(--rule);
          border-radius: 0;
          background: none;
        }
        .story .st-top {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          gap: 12px;
          margin-bottom: 8px;
        }
        .story .st-era {
          font-size: 10.5px;
          letter-spacing: 0.1em;
          color: var(--ink-3);
          font-variant-numeric: tabular-nums;
        }
        .story .st-fam {
          font-size: 10px;
          font-weight: 700;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          padding: 0 0 0 10px;
          border: 0;
          border-left: 1px solid color-mix(in srgb, var(--c, #8a7b64) 55%, #c6baa4);
          background: none;
          color: var(--ink-3);
        }
        .story h3 {
          margin: 0 0 8px;
          font-family: var(--serif);
          font-size: 18px;
          font-weight: 700;
          line-height: 1.45;
          letter-spacing: -0.01em;
        }
        .story p {
          margin: 0;
          font-size: 13.2px;
          line-height: 1.8;
          color: var(--ink-2);
        }
        .story .st-jump {
          margin-top: 12px;
          padding: 0;
          border: 0;
          background: none;
          color: var(--ink-3);
          font-family: inherit;
          font-size: 11.5px;
          letter-spacing: 0.02em;
          cursor: pointer;
          text-decoration: underline;
          text-decoration-color: var(--rule-strong);
          text-underline-offset: 3px;
        }
        .story .st-jump:hover { color: var(--accent); }
        
        /* ───────────── 소개 / 푸터 ───────────── */
        .about {
          padding: clamp(32px, 5vw, 56px) clamp(20px, 5vw, 40px) clamp(36px, 5vw, 60px);
          border-top: 1px solid var(--rule-strong);
        }
        .about-card { max-width: 720px; margin: 0 auto; padding: 0; border: 0; background: none; }
        .about-card h2 {
          margin: 0 0 14px;
          font-family: var(--serif);
          font-size: 22px;
          font-weight: 700;
          letter-spacing: -0.01em;
        }
        .about-card p {
          margin: 0 0 14px;
          font-size: 13.4px;
          line-height: 1.85;
          color: var(--ink-2);
        }
        .about-card p:last-child { margin-bottom: 0; }
        .about-card .quote {
          padding-left: 14px;
          border-left: 1px solid var(--rule-strong);
          color: var(--ink-3);
          font-size: 12.8px;
        }
        
        .site-footer {
          padding: 24px clamp(20px, 5vw, 40px) 48px;
          border-top: 1px solid var(--rule);
          background: var(--paper-2);
        }
        .footer-inner {
          max-width: 1200px;
          margin: 0 auto;
          font-size: 12px;
          line-height: 1.8;
          color: var(--ink-3);
        }
        .footer-inner p { margin: 0 0 8px; }
        .fine { font-size: 11.4px; color: var(--ink-3); }
        
        /* ───────────── 다크(선택) ───────────── */
        @media (prefers-color-scheme: dark) {
          :root {
            --paper: #14120f;
            --paper-2: #1a1713;
            --paper-3: #221d17;
            --card: #171410;
            --ink: #e9e1d1;
            --ink-2: #c6bba7;
            --ink-3: #9d9181;
            --rule: #322c24;
            --rule-strong: #4a4237;
            --accent: #cf7a52;
            color-scheme: dark;
          }
          .edge { stroke: #5b5245; }
          .edge.dashed { stroke: #453e34; }
          .scrim { background: rgba(0, 0, 0, 0.55); }
        }
        
        /* ───────────── 반응형 ───────────── */
        @media (max-width: 720px) {
          body { font-size: 14.5px; }
          .scroll-hint { display: block; }
          .stage { max-height: 66vh; }
          .hero-facts { gap: 4px 18px; }
          .hero-facts b { font-size: 18px; }
          .hero h1 { max-width: 12ch; }
          .hint { flex: 1 1 100%; }
          .panel {
            top: auto;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: min(76vh, 640px);
            padding: 16px 20px 28px;
            border-left: 0;
            border-top: 1px solid var(--rule-strong);
            border-radius: 0;
            transform: translateY(101%);
          }
          .panel.open { transform: none; }
          .panel-grip {
            display: block;
            width: 36px;
            height: 1px;
            margin: 0 auto 14px;
            background: var(--rule-strong);
          }
          .panel h3 { font-size: 22px; }
          .panel-close { top: 12px; right: 14px; }
        }
        
        @media (prefers-reduced-motion: reduce) {
          html { scroll-behavior: auto; }
          *, *::before, *::after {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.001ms !important;
          }
          .btn:hover::after { transform: none; }
        }
        
        @media print {
          .controls, .panel, .scrim, .hero-bg, .scroll-hint { display: none; }
          body { background: #fff; color: #000; }
          .stage { max-height: none; border-color: #999; }
        }
        
    steps:
      - uses: actions/checkout@v4

      - name: 스타일시트 반영
        run: |
          python3 - <<'PY'
          import os, pathlib
          css = os.environ["CSS_TEXT"].rstrip("\n") + "\n"
          pathlib.Path("assets/styles.css").write_text(css, encoding="utf-8")
          print("css bytes:", len(css.encode("utf-8")))
          PY
          git config user.name "sigco3111"
          git config user.email "sigco3111@users.noreply.github.com"
          git add assets/styles.css
          git commit -m "디자인: 계보도 선·화살표·노드 표기를 헤어라인 중심으로 다듬다" || echo "변경 없음"
          git push

      - name: README 갱신
        run: |
          python3 - <<'PY'
          import pathlib

          p = pathlib.Path("README.md")
          t = p.read_text(encoding="utf-8")

          design = """## 디자인

          인쇄물·학술 연표 쪽에 가깝게 다시 잡았습니다. 구성(104개 직무·7계열·17개 시대 구간·상세 패널·검색·필터·해시 딥링크·이야기 카드)은 그대로입니다.

          - **색** — 종이색 바탕(`#f7f3ea`)과 잉크색 본문(`#1f1b16`), 포인트는 짙은 벽돌색(`#8d3820`) 한 가지. 7개 계열은 채도를 낮춘 어스톤으로 작은 마커·가는 선·글머리표에만 씁니다.
          - **서체** — 제목은 `Noto Serif KR`/`Nanum Myeongjo`/`Batang` 계열 명조, 본문은 `Pretendard`/`Apple SD Gothic Neo`/`Malgun Gothic` 계열 고딕. 크기 대비를 크게 두고, 숫자는 `tabular-nums`. 외부 폰트·CDN은 쓰지 않습니다.
          - **구조** — 1px 헤어라인과 여백으로 구획합니다. 그림자·블러·그라데이션·둥근 카드는 쓰지 않고 모서리는 2px 이하입니다. 영문 직무명은 작은 보조 텍스트로 내렸습니다.
          - **계보도** — 노드는 상자 대신 텍스트와 작은 마커, 관계선은 잉크색 1.2px 실선과 옅은 점선. 강조는 색이 번쩍이는 대신 선 굵기와 농도로 합니다. 시대 라벨은 왼쪽 세로 눈금처럼 섭니다.
          - **이야기 카드** — 신문 칼럼처럼 텍스트 중심으로, 카드 대신 헤어라인으로 나눈 단.
          - **다크 모드** — `prefers-color-scheme: dark`에서 따뜻한 먹색 바탕으로 바뀝니다.

          ## 스크린샷"""

          pairs = [
              ("다크 + 네온/글래스모피즘 테마, 반응형",
               "종이색 바탕·명조 제목의 에디토리얼 테마(헤어라인·어스톤), 반응형"),
              ("화살표 머리는 계열 색을 따릅니다.",
               "선과 화살표 머리는 잉크색 헤어라인입니다."),
              ("-- 모션 최소화 설정에서는 히어로 애니메이션과 전환을 끕니다.",
               "-- 모션 최소화 설정에서는 패널 이동과 화살표 전환 애니메이션을 끕니다. 포커스 링과 4.5:1 이상 대비는 그대로 유지합니다."),
              ("## 스크린샷", design),
          ]

          for old, new in pairs:
              if old not in t:
                  print("MISS:", old[:40])
                  continue
              t = t.replace(old, new, 1)

          p.write_text(t, encoding="utf-8")
          print("README 길이", len(t))

          PY
          git add README.md
          git commit -m "docs: README에 디자인 소개 추가, 구조 설명 문구 갱신" || echo "변경 없음"
          git push

  shots:
    if: github.event.inputs.mode == 'shots'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Playwright 설치
        run: |
          npm init -y > /dev/null 2>&1
          npm i -D playwright@1.49.1 > /dev/null
          npx playwright install --with-deps chromium

      - name: 캡처와 점검
        run: |
          cat > shots.cjs <<'JS'
          const { chromium } = require('playwright');

          const BASE = 'https://sigco3111.github.io/sw-job-title-family-tree-ko/';
          const issues = [];

          (async () => {
            const browser = await chromium.launch();

            const ctx = await browser.newContext({ viewport: { width: 1280, height: 800 }, colorScheme: 'light' });
            const page = await ctx.newPage();
            page.on('console', (m) => { if (m.type() === 'error') issues.push('console: ' + m.text()); });
            page.on('pageerror', (e) => issues.push('pageerror: ' + e.message));
            page.on('requestfailed', (r) => issues.push('requestfailed: ' + r.url()));

            await page.goto(BASE, { waitUntil: 'networkidle' });
            await page.waitForSelector('.node');
            const nodeCount = await page.locator('.node').count();
            const bg = await page.evaluate(() => getComputedStyle(document.body).backgroundColor);
            const h1font = await page.evaluate(() => getComputedStyle(document.querySelector('.hero h1')).fontFamily);
            await page.screenshot({ path: 'docs/screenshots/desktop-1280x800.png' });

            await page.fill('#search', 'sre');
            await page.waitForTimeout(600);
            const searchMatches = await page.locator('.node.is-match').count();
            const hint = (await page.textContent('#resultHint') || '').trim();
            await page.fill('#search', '');
            await page.waitForTimeout(400);

            await page.getByRole('button', { name: /운영·인프라/ }).first().click();
            await page.waitForTimeout(600);
            const visibleAfterFilter = await page.locator('.node:not(.is-dim)').count();
            await page.getByRole('button', { name: /전체 계열/ }).first().click();
            await page.waitForTimeout(400);

            await page.locator('.node').filter({ hasText: 'SRE' }).first().click().catch(() => {});
            await page.waitForTimeout(600);
            const panelByClick = await page.locator('.panel.open').count();
            await page.locator('#panelClose').click().catch(() => {});

            const detail = await ctx.newPage();
            detail.on('console', (m) => { if (m.type() === 'error') issues.push('detail console: ' + m.text()); });
            detail.on('pageerror', (e) => issues.push('detail pageerror: ' + e.message));
            await detail.goto(BASE + '#sre', { waitUntil: 'networkidle' });
            await detail.waitForSelector('.panel.open', { timeout: 15000 });
            const title = (await detail.textContent('.panel h3') || '').trim();
            await detail.evaluate(() => { const el = document.getElementById('panel'); if (el) el.scrollTop = 0; });
            await detail.waitForTimeout(400);
            await detail.screenshot({ path: 'docs/screenshots/detail-panel-1280x800.png' });

            const mctx = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 2,
              isMobile: true,
              hasTouch: true,
              colorScheme: 'light',
            });
            const mp = await mctx.newPage();
            mp.on('console', (m) => { if (m.type() === 'error') issues.push('mobile console: ' + m.text()); });
            mp.on('pageerror', (e) => issues.push('mobile pageerror: ' + e.message));
            await mp.goto(BASE, { waitUntil: 'networkidle' });
            await mp.waitForSelector('.node');
            await mp.screenshot({ path: 'docs/screenshots/mobile-390x844.png' });
            const scrollW = await mp.evaluate(() => document.documentElement.scrollWidth);

            await browser.close();

            const report = { nodeCount, searchMatches, hint, visibleAfterFilter, panelByClick, deepLinkTitle: title, bg, h1font, mobileScrollWidth: scrollW, issues };
            console.log(JSON.stringify(report, null, 2));

            if (nodeCount !== 104) issues.push('node count ' + nodeCount);
            if (searchMatches < 1) issues.push('search found nothing');
            if (visibleAfterFilter >= 104) issues.push('filter did nothing');
            if (!panelByClick) issues.push('node click did not open panel');
            if (!/SRE/.test(title)) issues.push('deep link panel title: ' + title);
            if (scrollW > 392) issues.push('mobile horizontal overflow ' + scrollW);
            if (issues.length) { console.error('ISSUES', issues); process.exit(1); }
            console.log('ALL CHECKS PASSED');
          })();

          JS
          node shots.cjs

      - name: 스크린샷 커밋
        run: |
          git config user.name "sigco3111"
          git config user.email "sigco3111@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "디자인: 배포 화면 스크린샷 갱신(데스크톱·상세 패널·모바일)" || echo "변경 없음"
          git push
