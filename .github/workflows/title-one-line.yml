name: title-one-line

on:
  workflow_dispatch:
    inputs:
      commit_screenshots:
        description: "docs/screenshots 캡처를 갱신해 커밋할지"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm i playwright@1.48.2 --no-save --no-package-lock
          npx playwright install --with-deps chromium

      - name: Check hero title is a single line
        run: |
          cat > title-check.mjs <<'EOF'
          import { chromium } from 'playwright';

          const url = 'https://sigco3111.github.io/sw-job-title-family-tree-ko/?cb=' + Date.now();
          const browser = await chromium.launch();
          const out = [];

          for (const [name, width, height] of [['desktop', 1280, 800], ['mobile', 390, 844]]) {
            const page = await browser.newPage({ viewport: { width, height }, deviceScaleFactor: 1 });
            await page.goto(url, { waitUntil: 'networkidle' });
            await page.waitForSelector('.hero h1');
            const m = await page.evaluate(() => {
              const h1 = document.querySelector('.hero h1');
              const cs = getComputedStyle(h1);
              const r = h1.getBoundingClientRect();
              const lh = parseFloat(cs.lineHeight);
              return {
                text: h1.textContent.replace(/\s+/g, ' ').trim(),
                fontSize: cs.fontSize,
                lineHeight: cs.lineHeight,
                whiteSpace: cs.whiteSpace,
                rectWidth: Math.round(r.width * 100) / 100,
                rectHeight: Math.round(r.height * 100) / 100,
                lines: Math.round((r.height / lh) * 100) / 100,
                singleLine: r.height <= lh * 1.05,
                scrollWidth: h1.scrollWidth,
                clientWidth: h1.clientWidth,
                docScrollWidth: document.documentElement.scrollWidth,
                viewportWidth: window.innerWidth,
                horizontalOverflow: document.documentElement.scrollWidth > window.innerWidth,
              };
            });
            out.push({ name, ...m });
            await page.close();
          }

          await browser.close();
          console.log(JSON.stringify(out, null, 2));
          const bad = out.filter((x) => !x.singleLine || x.horizontalOverflow);
          if (bad.length) {
            console.error('FAIL: one-line check failed for: ' + bad.map((b) => b.name).join(', '));
            process.exit(1);
          }
          console.log('OK: hero title is one line at every checked width');
          EOF
          node title-check.mjs 2>&1 | tee result.txt; { echo '```'; cat result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; grep -q '^OK:' result.txt

      - name: Refresh screenshots
        if: ${{ inputs.commit_screenshots }}
        run: |
          mkdir -p docs/screenshots
          cat > shot.mjs <<'EOF'
          import { chromium } from 'playwright';

          const url = 'https://sigco3111.github.io/sw-job-title-family-tree-ko/?cb=' + Date.now();
          const browser = await chromium.launch();

          const desktop = await browser.newPage({ viewport: { width: 1280, height: 800 } });
          await desktop.goto(url, { waitUntil: 'networkidle' });
          await desktop.waitForSelector('.hero h1');
          await desktop.screenshot({ path: 'docs/screenshots/desktop-1280x800.png' });
          await desktop.getByRole('button', { name: /^프로그래머/ }).first().click();
          await desktop.waitForTimeout(700);
          await desktop.screenshot({ path: 'docs/screenshots/detail-panel-1280x800.png' });
          await desktop.close();

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true });
          await mobile.goto(url, { waitUntil: 'networkidle' });
          await mobile.waitForSelector('.hero h1');
          await mobile.screenshot({ path: 'docs/screenshots/mobile-390x844.png' });
          await mobile.close();

          await browser.close();
          EOF
          node shot.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "문서: 스크린샷 갱신" || echo "no screenshot change"
          git push
