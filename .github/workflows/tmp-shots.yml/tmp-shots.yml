name: tmp-shots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 페이지 보정(stories 스크립트 연결, .nojekyll)
        run: |
          python3 - <<'PY'
          import io, os
          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          if 'data/stories.js' not in s:
              s = s.replace('<script src="assets/app.js"></script>',
                            '<script src="data/stories.js"></script>\n<script src="assets/app.js"></script>')
              io.open(p, 'w', encoding='utf-8').write(s)
              print('stories script inserted')
          else:
              print('already linked')
          io.open('.nojekyll', 'w').write('')
          PY
          git config user.name "sigco3111"
          git config user.email "sigco3111@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "docs: 이야기 카드 스크립트 연결과 .nojekyll 추가"
            git push
          else
            echo "no change"
          fi

      - name: 배포 대기(HTTP 200 확인)
        run: |
          URL="https://sigco3111.github.io/sw-job-title-family-tree-ko/"
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /tmp/page.html -w "%{http_code}" "$URL")
            echo "try $i: HTTP $CODE"
            if [ "$CODE" = "200" ] && grep -q "data/stories.js" /tmp/page.html; then
              echo "READY: HTTP $CODE"; break
            fi
            sleep 10
          done
          curl -s -o /dev/null -w "final status: %{http_code}\n" "$URL"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Playwright 설치
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.47.2 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 캡처
        run: |
          mkdir -p docs/screenshots
          cat > shot.js <<'JS'
          const { chromium } = require('playwright');
          const URL = 'https://sigco3111.github.io/sw-job-title-family-tree-ko/';
          (async () => {
            const browser = await chromium.launch();
            // 데스크톱
            const ctx = await browser.newContext({ viewport: { width: 1280, height: 800 }, deviceScaleFactor: 1 });
            const page = await ctx.newPage();
            const res = await page.goto(URL, { waitUntil: 'networkidle' });
            console.log('HTTP status:', res.status());
            await page.waitForSelector('button.node', { timeout: 30000 });
            const count = await page.locator('button.node').count();
            console.log('nodes rendered:', count);
            console.log('stories rendered:', await page.locator('.story').count());
            await page.waitForTimeout(1200);
            await page.screenshot({ path: 'docs/screenshots/desktop-1280x800.png' });
            // 상세 패널
            await page.locator('button.node[data-id="sre"]').click();
            await page.waitForTimeout(900);
            await page.screenshot({ path: 'docs/screenshots/detail-panel-1280x800.png' });
            await ctx.close();
            // 모바일
            const mctx = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true });
            const mp = await mctx.newPage();
            await mp.goto(URL, { waitUntil: 'networkidle' });
            await mp.waitForSelector('button.node', { timeout: 30000 });
            await mp.waitForTimeout(1200);
            await mp.screenshot({ path: 'docs/screenshots/mobile-390x844.png' });
            await mctx.close();
            await browser.close();
          })();
          JS
          node shot.js
          ls -la docs/screenshots

      - name: 스크린샷 커밋
        run: |
          git config user.name "sigco3111"
          git config user.email "sigco3111@users.noreply.github.com"
          git add docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "docs: 배포 페이지 스크린샷 추가(데스크톱·상세 패널·모바일)"
            git push
          fi
